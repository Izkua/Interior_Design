name: InteriorDesign

options:
  # Change this to your own reverse-domain prefix before you run on a phone.
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  InteriorDesign:
    type: application
    platform: iOS
    sources:
      - path: InteriorDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.InteriorDesign
        PRODUCT_NAME: InteriorDesign
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Interior Design"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Set your Apple Developer team in Xcode (Signing & Capabilities) or here.
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES

  InteriorDesignTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: InteriorDesignTests
    dependencies:
      - target: InteriorDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.InteriorDesignTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  InteriorDesign:
    build:
      targets:
        InteriorDesign: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - InteriorDesignTests
